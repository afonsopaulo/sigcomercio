version: '3.8'

services:
  comercio-app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: sigcomercio
    ports:
      - "4001:80"
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    driver: bridge
